name: Windows

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B out/build/windows
          -G "Visual Studio 17 2022" -A x64
          -DProject_ENABLE_UNIT_TESTING=ON
          -DProject_ENABLE_CCACHE=OFF
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/out/install"

      - name: Build
        run: cmake --build out/build/windows --config Release --parallel 4

      - name: Test
        run: ctest --test-dir out/build/windows -C Release --output-on-failure

      - name: CLI smoke
        shell: pwsh
        run: |
          $switchOutput = & .\out\build\windows\bin\Release\vswitch.exe invalid 2>&1
          if ($LASTEXITCODE -eq 0 -or $switchOutput -notmatch "Invalid port") {
            throw "vswitch CLI smoke failed"
          }
          $portOutput = & .\out\build\windows\bin\Release\vport.exe 2>&1
          if ($LASTEXITCODE -eq 0 -or $portOutput -notmatch "Usage:") {
            throw "vport CLI smoke failed"
          }

      - name: Install
        run: cmake --install out/build/windows --config Release

