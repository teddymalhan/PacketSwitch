name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              name: "Ubuntu Latest GCC",
              os: ubuntu-latest,
              cc: "gcc",
              cxx: "g++",
              build_type: "Release"
            }
          - {
              name: "Ubuntu Latest Clang",
              os: ubuntu-latest,
              cc: "clang",
              cxx: "clang++",
              build_type: "Release"
            }
          - {
              name: "macOS Latest",
              os: macos-latest,
              cc: "clang",
              cxx: "clang++",
              build_type: "Release"
            }
          - {
              name: "Ubuntu Debug Build",
              os: ubuntu-latest,
              cc: "gcc",
              cxx: "g++",
              build_type: "Debug"
            }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            clang-format \
            clang-tidy \
            cppcheck \
            lcov

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} \
            -DWireLab_ENABLE_UNIT_TESTING=ON \
            -DWireLab_ENABLE_CCACHE=OFF \
            -G Ninja
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config.build_type }}

      - name: Run tests
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{ matrix.config.build_type }} --output-on-failure --verbose

  desktop-macos:
    name: Desktop Frontend (macOS)
    runs-on: macos-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('gui/Cargo.lock') }}

      # Metal stays off: the desktop job exists to check the frontend and its
      # binding, and the GPU backends are already covered by the build matrix.
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DWireLab_ENABLE_UNIT_TESTING=ON \
            -DWireLab_ENABLE_CCACHE=OFF \
            -DPROJECT_BUILD_DESKTOP=ON \
            -G Ninja

      - name: Build
        run: cmake --build build --config Release

      # Runs the whole suite: wirelab_desktop_bindings is the cargo test that
      # checks the Rust mirrors against the layout the C++ compiler produced,
      # and it is only meaningful next to the C++ tests of the same build.
      - name: Run tests
        working-directory: ${{github.workspace}}/build
        run: ctest -C Release --output-on-failure

      - name: Check formatting
        run: cargo fmt --manifest-path gui/Cargo.toml --check

      # The archives CMake just built are what the crate links against; find
      # them rather than hardcoding a layout the generator is free to change.
      # build.rs runs with gui/ as its working directory, so the paths it is
      # handed have to be absolute.
      - name: Lint
        run: |
          LIB_DIRS=$(find "$PWD/build" \( -name 'libwirelab_*.a' -o -name 'libWireLab.a' \) \
            -exec dirname {} \; | sort -u | paste -sd';' -)
          echo "Linking against: $LIB_DIRS"
          WIRELAB_LIB_DIRS="$LIB_DIRS" \
            cargo clippy --manifest-path gui/Cargo.toml --all-targets -- -D warnings

  static-analysis:
    name: Static Analysis (Clang-Tidy)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            clang \
            clang-tidy

      - name: Configure CMake with Clang-Tidy
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWireLab_ENABLE_UNIT_TESTING=ON \
            -DWireLab_ENABLE_CLANG_TIDY=ON \
            -DWireLab_ENABLE_CCACHE=OFF \
            -G Ninja
        env:
          CC: clang
          CXX: clang++

      - name: Build with static analysis
        run: cmake --build build --config Debug

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            lcov

      - name: Configure CMake with coverage
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWireLab_ENABLE_UNIT_TESTING=ON \
            -DWireLab_ENABLE_CODE_COVERAGE=ON \
            -DWireLab_ENABLE_CCACHE=OFF \
            -G Ninja
        env:
          CC: gcc
          CXX: g++

      - name: Build
        run: cmake --build build --config Debug

      - name: Run tests
        working-directory: ${{github.workspace}}/build
        run: ctest -C Debug --output-on-failure --verbose

      - name: Generate coverage report
        working-directory: ${{github.workspace}}/build
        run: |
          lcov --capture \
            --directory CMakeFiles/WireLab.dir \
            --rc geninfo_unexecuted_blocks=1 \
            --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./build/coverage.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  formatting-check:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check code formatting
        run: |
          find include/ src/ tests/ -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0 | \
          xargs -0 clang-format --dry-run --Werror

  sanitizers:
    name: Address Sanitizer
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build

      - name: Configure CMake with ASan
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWireLab_ENABLE_UNIT_TESTING=ON \
            -DWireLab_ENABLE_ASAN=ON \
            -DWireLab_ENABLE_CCACHE=OFF \
            -G Ninja
        env:
          CC: clang
          CXX: clang++

      - name: Build
        run: cmake --build build --config Debug

      - name: Run tests with ASan
        working-directory: ${{github.workspace}}/build
        run: ctest -C Debug --output-on-failure --verbose
